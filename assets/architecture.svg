<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do pipeline de processamento paralelo de imagens</title>
  <desc id="desc">Fluxo das implementações local em Python, AWS EC2 e web com GitHub Pages.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      :root { color-scheme: light dark; }
      .section { fill: #ffffff; stroke-width: 2; filter: url(#shadow); }
      .local-section { stroke: #2563eb; }
      .aws-section { stroke: #d97706; }
      .web-section { stroke: #7c3aed; }
      .section-title { font: 700 25px Inter, Segoe UI, Arial, sans-serif; }
      .section-subtitle { font: 500 16px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .node { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .node-blue, .database { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .node-amber { fill: #fffbeb; stroke: #f59e0b; }
      .node-violet { fill: #f5f3ff; stroke: #8b5cf6; }
      .label { font: 600 17px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .detail { font: 500 14px Inter, Segoe UI, Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      #arrow path { fill: #64748b; }
      .edge-dashed { stroke-dasharray: 8 7; }
      .edge-label { font: 600 14px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; text-anchor: middle; }

      @media (prefers-color-scheme: dark) {
        .section { fill: #111827; }
        .local-section { stroke: #60a5fa; }
        .aws-section { stroke: #fbbf24; }
        .web-section { stroke: #a78bfa; }
        .section-subtitle, .detail { fill: #cbd5e1; }
        .node { fill: #1e293b; stroke: #475569; }
        .node-blue, .database { fill: #172554; stroke: #60a5fa; }
        .node-amber { fill: #422006; stroke: #fbbf24; }
        .node-violet { fill: #2e1065; stroke: #a78bfa; }
        .label { fill: #f8fafc; }
        .edge { stroke: #94a3b8; }
        #arrow path { fill: #94a3b8; }
        .edge-label { fill: #cbd5e1; }
      }
    </style>
  </defs>
  <rect class="section local-section" x="35" y="35" width="1530" height="535" rx="24"/>
  <text class="section-title" x="70" y="78" fill="#1d4ed8">local/</text><text class="section-subtitle" x="150" y="78">Python + multiprocessing</text>
  <rect class="node node-blue" x="75" y="150" width="220" height="82"/><text class="label" x="185" y="183">generate_dataset.py</text><text class="detail" x="185" y="207">gera as imagens de teste</text>
  <g><path class="database" d="M345 162 C345 145 455 145 455 162 L455 218 C455 235 345 235 345 218 Z"/><ellipse class="database" cx="400" cy="162" rx="55" ry="17"/><text class="label" x="400" y="190">dataset/*.jpg</text><text class="detail" x="400" y="213">entrada</text></g>
  <rect class="node" x="520" y="105" width="235" height="90"/><text class="label" x="637.5" y="140">sequential.py</text><text class="detail" x="637.5" y="166">1 processo</text>
  <rect class="node node-blue" x="520" y="225" width="235" height="90"/><text class="label" x="637.5" y="260">parallel.py</text><text class="detail" x="637.5" y="286">multiprocessing.Pool</text>
  <rect class="node node-blue" x="825" y="165" width="245" height="90"/><text class="label" x="947.5" y="200">image_processor.py</text><text class="detail" x="947.5" y="226">gray → blur → Sobel</text>
  <g><path class="database" d="M1140 167 C1140 147 1330 147 1330 167 L1330 238 C1330 258 1140 258 1140 238 Z"/><ellipse class="database" cx="1235" cy="167" rx="95" ry="20"/><text class="label" x="1235" y="199">output/</text><text class="detail" x="1235" y="223">sequential/ · parallel/</text></g>
  <rect class="node" x="1380" y="165" width="145" height="90"/><text class="label" x="1452.5" y="200">verify.py</text><text class="detail" x="1452.5" y="226">SHA-256</text>
  <rect class="node node-blue" x="520" y="405" width="235" height="90"/><text class="label" x="637.5" y="440">benchmark.py</text><text class="detail" x="637.5" y="466">orquestra as medições</text>
  <g><path class="database" d="M895 407 C895 385 1125 385 1125 407 L1125 483 C1125 505 895 505 895 483 Z"/><ellipse class="database" cx="1010" cy="407" rx="115" ry="22"/><text class="label" x="1010" y="440">results/benchmark.csv</text><text class="detail" x="1010" y="466">speedup + Amdahl</text></g>
  <path class="edge" d="M295 191 H345"/><path class="edge" d="M455 178 C480 175 487 150 520 150"/><path class="edge" d="M455 202 C480 206 487 270 520 270"/>
  <path class="edge" d="M755 150 C790 150 795 190 825 198"/><path class="edge" d="M755 270 C790 270 795 230 825 222"/><path class="edge" d="M1070 210 H1140"/><path class="edge" d="M1330 210 H1380"/>
  <path class="edge edge-dashed" d="M610 405 C585 360 575 335 590 315"/><path class="edge edge-dashed" d="M665 405 C690 365 700 345 690 315"/><path class="edge edge-dashed" d="M755 450 C1080 560 1450 480 1452 255"/>
  <path class="edge" d="M755 450 H895"/><text class="edge-label" x="792" y="439">gera</text><text class="edge-label" x="1160" y="520">orquestra a verificação</text>
  <rect class="section aws-section" x="35" y="600" width="750" height="265" rx="24"/><text class="section-title" x="70" y="645" fill="#b45309">aws/</text><text class="section-subtitle" x="138" y="645">EC2</text>
  <rect class="node node-amber" x="80" y="700" width="230" height="90"/><text class="label" x="195" y="735">user-data.sh</text><text class="detail" x="195" y="761">configuração no 1º boot</text>
  <rect class="node node-amber" x="505" y="700" width="230" height="90"/><text class="label" x="620" y="735">server.py</text><text class="detail" x="620" y="761">painel HTTP · porta 80</text>
  <path class="edge edge-dashed" d="M195 700 C195 615 500 590 580 495"/><text class="edge-label" x="340" y="617">executa benchmark.py</text><path class="edge" d="M1010 505 C1010 610 620 620 620 700"/><text class="edge-label" x="792" y="616">exibe os resultados</text>
  <rect class="section web-section" x="815" y="600" width="750" height="265" rx="24"/><text class="section-title" x="850" y="645" fill="#6d28d9">web/</text><text class="section-subtitle" x="920" y="645">GitHub Pages</text>
  <rect class="node node-violet" x="870" y="700" width="265" height="90"/><text class="label" x="1002.5" y="735">runner.js</text><text class="detail" x="1002.5" y="761">thread principal × Web Workers</text>
  <rect class="node node-violet" x="1240" y="700" width="265" height="90"/><text class="label" x="1372.5" y="735">processor.js</text><text class="detail" x="1372.5" y="761">gray → blur → Sobel</text><path class="edge" d="M1135 745 H1240"/>
</svg>