<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1370" viewBox="0 0 1120 1370" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura técnica do pipeline de processamento paralelo de imagens</title>
  <desc id="desc">Diagrama dos fluxos local em Python, AWS EC2 e web com GitHub Pages, incluindo processamento, armazenamento, benchmark e validação.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .zone{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .zone-local{stroke:#2563eb}.zone-aws{stroke:#b45309}.zone-web{stroke:#7c3aed}
      .header-line{stroke:#cbd5e1;stroke-width:1}
      .node{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}
      .node-blue{fill:#eff6ff;stroke:#2563eb}.node-amber{fill:#fffbeb;stroke:#b45309}.node-violet{fill:#f5f3ff;stroke:#7c3aed}
      .store{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.5}
      .edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .control{fill:none;stroke:#475569;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .zone-title{font:700 22px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .zone-meta{font:500 15px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .code{font:700 17px "SFMono-Regular",Consolas,"Liberation Mono",monospace;fill:#0f172a;text-anchor:middle}
      .detail{font:500 14px Inter,Segoe UI,Arial,sans-serif;fill:#475569;text-anchor:middle}
      .tag{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#ffffff;text-anchor:middle}
      .edge-label{font:600 12px Inter,Segoe UI,Arial,sans-serif;fill:#475569;text-anchor:middle}
      .legend{font:500 13px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
    </style>
  </defs>

  <!-- LOCAL / PYTHON -->
  <rect class="zone zone-local" x="30" y="30" width="1060" height="850" rx="16"/>
  <text class="zone-title" x="64" y="72">Pipeline local</text>
  <text class="zone-meta" x="64" y="97">Python · CPython · multiprocessing</text>
  <line class="header-line" x1="60" y1="116" x2="1060" y2="116"/>

  <!-- data flow -->
  <path class="edge" d="M324 178H410"/>
  <path class="edge" d="M545 226V262H282V302"/>
  <path class="edge" d="M545 226V262H788V302"/>
  <path class="edge" d="M282 394V432H535V470"/>
  <path class="edge" d="M788 394V432H535V470"/>
  <path class="edge" d="M535 562V606"/>
  <path class="edge" d="M660 652H752"/>
  <path class="edge" d="M535 698V744"/>

  <!-- orchestration / control flow -->
  <path class="control" d="M268 808H210V348H162"/>
  <path class="control" d="M268 828H180V282H788V302"/>
  <path class="control" d="M512 812H930V698"/>
  <text class="edge-label" x="224" y="790">executa e mede</text>
  <text class="edge-label" x="787" y="802">solicita validação</text>

  <rect x="62" y="143" width="34" height="22" rx="5" fill="#2563eb"/><text class="tag" x="79" y="159">01</text>
  <rect class="node node-blue" x="114" y="137" width="210" height="82" rx="10"/>
  <text class="code" x="219" y="171" style="font-size:15px">generate_dataset.py</text><text class="detail" x="219" y="196">gera imagens de teste</text>

  <rect x="358" y="143" width="34" height="22" rx="5" fill="#2563eb"/><text class="tag" x="375" y="159">02</text>
  <rect class="store" x="410" y="137" width="270" height="89" rx="10"/>
  <text class="code" x="545" y="174">dataset/*.jpg</text><text class="detail" x="545" y="199">lote de entrada</text>

  <rect x="62" y="308" width="34" height="22" rx="5" fill="#2563eb"/><text class="tag" x="79" y="324">03A</text>
  <rect class="node" x="114" y="302" width="336" height="92" rx="10"/>
  <text class="code" x="282" y="339">sequential.py</text><text class="detail" x="282" y="367">1 processo · execução de referência</text>

  <rect x="620" y="308" width="34" height="22" rx="5" fill="#2563eb"/><text class="tag" x="637" y="324">03B</text>
  <rect class="node node-blue" x="672" y="302" width="232" height="92" rx="10"/>
  <text class="code" x="788" y="339">parallel.py</text><text class="detail" x="788" y="367">Pool · workers · chunksize=1</text>

  <rect x="362" y="476" width="34" height="22" rx="5" fill="#2563eb"/><text class="tag" x="379" y="492">04</text>
  <rect class="node node-blue" x="414" y="470" width="242" height="92" rx="10"/>
  <text class="code" x="535" y="507">image_processor.py</text><text class="detail" x="535" y="535">grayscale → Gaussian blur → Sobel</text>

  <rect x="362" y="612" width="34" height="22" rx="5" fill="#2563eb"/><text class="tag" x="379" y="628">05</text>
  <rect class="store" x="414" y="606" width="246" height="92" rx="10"/>
  <text class="code" x="537" y="643">output/</text><text class="detail" x="537" y="671">sequential/ · parallel/</text>

  <rect x="700" y="612" width="34" height="22" rx="5" fill="#2563eb"/><text class="tag" x="717" y="628">06</text>
  <rect class="node" x="752" y="606" width="238" height="92" rx="10"/>
  <text class="code" x="871" y="643">verify.py</text><text class="detail" x="871" y="671">comparação SHA-256</text>

  <rect class="node node-blue" x="62" y="770" width="206" height="82" rx="10"/>
  <text class="code" x="165" y="804">benchmark.py</text><text class="detail" x="165" y="830">orquestra as medições</text>
  <rect class="store" x="320" y="770" width="292" height="82" rx="10"/>
  <text class="code" x="466" y="804">results/benchmark.csv</text><text class="detail" x="466" y="830">tempo · speedup · Amdahl</text>
  <path class="edge" d="M268 811H320"/>

  <!-- AWS -->
  <rect class="zone zone-aws" x="30" y="910" width="1060" height="210" rx="16"/>
  <text class="zone-title" x="64" y="951">Implantação AWS</text>
  <text class="zone-meta" x="64" y="976">Amazon EC2 · Ubuntu · serviço HTTP</text>
  <line class="header-line" x1="60" y1="993" x2="1060" y2="993"/>
  <path class="edge" d="M330 1054H424"/><path class="edge" d="M696 1054H790"/>
  <rect class="node node-amber" x="80" y="1012" width="250" height="84" rx="10"/>
  <text class="code" x="205" y="1046">user-data.sh</text><text class="detail" x="205" y="1074">provisionamento no primeiro boot</text>
  <rect class="node node-amber" x="424" y="1012" width="272" height="84" rx="10"/>
  <text class="code" x="560" y="1046">benchmark.py</text><text class="detail" x="560" y="1074">executa pipeline Python local</text>
  <rect class="node node-amber" x="790" y="1012" width="250" height="84" rx="10"/>
  <text class="code" x="915" y="1046">server.py</text><text class="detail" x="915" y="1074">painel HTTP · porta 80</text>

  <!-- WEB -->
  <rect class="zone zone-web" x="30" y="1150" width="1060" height="170" rx="16"/>
  <text class="zone-title" x="64" y="1191">Demonstração web</text>
  <text class="zone-meta" x="64" y="1216">GitHub Pages · execução no navegador</text>
  <line class="header-line" x1="60" y1="1232" x2="1060" y2="1232"/>
  <path class="edge" d="M488 1276H632"/>
  <rect class="node node-violet" x="112" y="1248" width="376" height="52" rx="10"/>
  <text class="code" x="300" y="1271">runner.js</text><text class="detail" x="300" y="1291">thread principal · coordenação</text>
  <rect class="node node-violet" x="632" y="1248" width="376" height="52" rx="10"/>
  <text class="code" x="820" y="1271">processor.js</text><text class="detail" x="820" y="1291">Web Workers · processamento por faixas</text>

  <!-- legend -->
  <line x1="34" y1="1350" x2="74" y2="1350" stroke="#64748b" stroke-width="2"/><text class="legend" x="84" y="1355">fluxo de dados</text>
  <line x1="230" y1="1350" x2="270" y2="1350" stroke="#475569" stroke-width="2" stroke-dasharray="7 6"/><text class="legend" x="280" y="1355">orquestração e controle</text>
</svg>