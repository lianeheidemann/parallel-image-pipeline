<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura do pipeline de processamento paralelo de imagens</title>
<desc id="desc">Diagrama técnico mostrando os ambientes Local Python, AWS EC2 e GitHub Pages, seus componentes, fluxos de dados e mecanismos de paralelismo.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  <style>
    .bg{fill:#ffffff}
    .frame{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.4}
    .frame-local{stroke:#2563eb}.frame-aws{stroke:#d97706}.frame-web{stroke:#7c3aed}
    .header{font:700 22px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
    .meta{font:500 14px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}
    .label{font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a;text-anchor:middle}
    .small{font:500 12px Inter,Segoe UI,Arial,sans-serif;fill:#64748b;text-anchor:middle}
    .mono{font:700 14px "SFMono-Regular",Consolas,"Liberation Mono",monospace;fill:#0f172a;text-anchor:middle}
    .node{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.3}
    .blue{fill:#eff6ff;stroke:#3b82f6}.amber{fill:#fffbeb;stroke:#f59e0b}.violet{fill:#f5f3ff;stroke:#8b5cf6}
    .store{fill:#f8fafc;stroke:#64748b;stroke-width:1.3}
    .edge{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}
    .dash{fill:none;stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:6 6;marker-end:url(#arrow)}
    .rule{stroke:#e2e8f0;stroke-width:1}
    .pill{font:700 11px Inter,Segoe UI,Arial,sans-serif;fill:#334155;text-anchor:middle}
    .note{font:600 12px Inter,Segoe UI,Arial,sans-serif;fill:#475569;text-anchor:middle}
  </style>
</defs>
<rect class="bg" width="1200" height="1180"/>

<!-- LOCAL -->
<rect class="frame frame-local" x="32" y="28" width="1136" height="650" rx="14"/>
<text class="header" x="64" y="68">01 · Execução local — Python</text>
<text class="meta" x="64" y="92">CPython · OpenCV · multiprocessing.Pool · processamento CPU-bound</text>
<line class="rule" x1="64" y1="112" x2="1136" y2="112"/>

<!-- input -->
<rect class="blue" x="74" y="148" width="190" height="68" rx="8"/>
<text class="mono" x="169" y="176">generate_dataset.py</text>
<text class="small" x="169" y="198">gera imagens de teste</text>
<path class="edge" d="M264 182H328"/>
<rect class="store" x="328" y="148" width="190" height="68" rx="8"/>
<text class="mono" x="423" y="176">dataset/*.jpg</text>
<text class="small" x="423" y="198">entrada compartilhada</text>

<!-- split -->
<path class="edge" d="M518 182H576V150H642"/>
<path class="edge" d="M518 182H576V286H642"/>

<rect class="node" x="642" y="124" width="260" height="84" rx="8"/>
<text class="mono" x="772" y="155">sequential.py</text>
<text class="small" x="772" y="177">1 processo</text>
<text class="small" x="772" y="195">referência de tempo</text>

<rect class="blue" x="642" y="252" width="260" height="84" rx="8"/>
<text class="mono" x="772" y="283">parallel.py</text>
<text class="small" x="772" y="305">Pool(workers)</text>
<text class="small" x="772" y="323">chunksize = 1 imagem</text>

<!-- processor -->
<path class="edge" d="M902 166H964V238"/>
<path class="edge" d="M902 294H964V238"/>
<rect class="blue" x="922" y="350" width="214" height="104" rx="8"/>
<text class="mono" x="1029" y="380">image_processor.py</text>
<text class="small" x="1029" y="404">grayscale</text>
<text class="small" x="1029" y="422">Gaussian blur</text>
<text class="small" x="1029" y="440">Sobel</text>
<path class="edge" d="M964 238V350"/>

<!-- outputs -->
<path class="edge" d="M922 402H838"/>
<rect class="store" x="610" y="366" width="228" height="72" rx="8"/>
<text class="mono" x="724" y="394">output/</text>
<text class="small" x="724" y="416">sequential/ · parallel/</text>

<path class="edge" d="M610 402H526"/>
<rect class="node" x="316" y="366" width="210" height="72" rx="8"/>
<text class="mono" x="421" y="394">verify.py</text>
<text class="small" x="421" y="416">SHA-256 · equivalência</text>

<!-- benchmark plane -->
<line class="rule" x1="64" y1="492" x2="1136" y2="492"/>
<text class="meta" x="64" y="521">Camada de orquestração e medição</text>
<rect class="blue" x="102" y="548" width="220" height="72" rx="8"/>
<text class="mono" x="212" y="576">benchmark.py</text>
<text class="small" x="212" y="598">executa · mede · consolida</text>

<path class="dash" d="M322 584H444V294H642"/>
<path class="dash" d="M444 584V166H642"/>
<path class="dash" d="M322 584H444V402H316"/>

<rect class="store" x="492" y="548" width="274" height="72" rx="8"/>
<text class="mono" x="629" y="576">results/benchmark.csv</text>
<text class="small" x="629" y="598">tempo · speedup · Amdahl</text>
<path class="edge" d="M322 584H492"/>

<rect class="node" x="842" y="548" width="260" height="72" rx="8"/>
<text class="label" x="972" y="576">Métricas comparadas</text>
<text class="small" x="972" y="598">sequencial × paralelo</text>
<path class="edge" d="M766 584H842"/>

<!-- AWS -->
<rect class="frame frame-aws" x="32" y="710" width="1136" height="202" rx="14"/>
<text class="header" x="64" y="750">02 · Implantação — AWS EC2</text>
<text class="meta" x="64" y="774">Mesmo pipeline Python local, executado em ambiente remoto padronizado</text>
<line class="rule" x1="64" y1="794" x2="1136" y2="794"/>

<rect class="amber" x="90" y="820" width="218" height="62" rx="8"/>
<text class="mono" x="199" y="846">user-data.sh</text>
<text class="small" x="199" y="866">provisionamento</text>
<path class="edge" d="M308 851H384"/>
<rect class="amber" x="384" y="820" width="250" height="62" rx="8"/>
<text class="label" x="509" y="846">Pipeline Python</text>
<text class="small" x="509" y="866">benchmark.py + multiprocessing</text>
<path class="edge" d="M634 851H710"/>
<rect class="amber" x="710" y="820" width="184" height="62" rx="8"/>
<text class="mono" x="802" y="846">results/</text>
<text class="small" x="802" y="866">CSV + logs</text>
<path class="edge" d="M894 851H954"/>
<rect class="amber" x="954" y="820" width="150" height="62" rx="8"/>
<text class="mono" x="1029" y="846">server.py</text>
<text class="small" x="1029" y="866">HTTP :80</text>

<!-- WEB -->
<rect class="frame frame-web" x="32" y="944" width="1136" height="170" rx="14"/>
<text class="header" x="64" y="984">03 · Demonstração — GitHub Pages</text>
<text class="meta" x="64" y="1008">JavaScript no navegador · paralelismo por Web Workers · sem backend</text>
<line class="rule" x1="64" y1="1028" x2="1136" y2="1028"/>

<rect class="violet" x="108" y="1050" width="250" height="62" rx="8"/>
<text class="mono" x="233" y="1076">runner.js</text>
<text class="small" x="233" y="1096">thread principal</text>
<path class="edge" d="M358 1081H440"/>
<rect class="violet" x="440" y="1050" width="290" height="62" rx="8"/>
<text class="label" x="585" y="1076">Fila de faixas da imagem</text>
<text class="small" x="585" y="1096">distribuição de trabalho</text>
<path class="edge" d="M730 1081H812"/>
<rect class="violet" x="812" y="1050" width="280" height="62" rx="8"/>
<text class="mono" x="952" y="1076">processor.js</text>
<text class="small" x="952" y="1096">Web Workers · faixas em paralelo</text>

<!-- legend -->
<line x1="52" y1="1150" x2="90" y2="1150" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text class="meta" x="102" y="1155">fluxo de dados</text>
<line x1="250" y1="1150" x2="288" y2="1150" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<text class="meta" x="300" y="1155">orquestração / controle</text>
<text class="note" x="1040" y="1155">Local/AWS: processos · Web: workers</text>
</svg>