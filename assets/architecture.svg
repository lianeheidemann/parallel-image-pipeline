<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1380" viewBox="0 0 1000 1380" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do pipeline de processamento paralelo de imagens</title>
  <desc id="desc">Fluxo organizado das implementações local em Python, AWS EC2 e web com GitHub Pages.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .section{fill:#ffffff;stroke-width:2;filter:url(#shadow)}
      .local{stroke:#3b82f6}.aws{stroke:#d97706}.web{stroke:#7c3aed}
      .node{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#3b82f6}.amber{fill:#fffbeb;stroke:#d97706}.violet{fill:#f5f3ff;stroke:#7c3aed}
      .title{font:700 25px Inter,Segoe UI,Arial,sans-serif}.subtitle{font:500 17px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .label{font:700 20px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}
      .detail{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:middle}
      .edge{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:9 8}
      .edge-label{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#475569;text-anchor:middle}
    </style>
  </defs>

  <rect class="section local" x="30" y="30" width="940" height="870" rx="26"/>
  <text class="title" x="70" y="78" fill="#3b82f6">local/</text>
  <text class="subtitle" x="145" y="78">Python + multiprocessing</text>

  <!-- Conectores locais, desenhados antes das caixas -->
  <path class="edge" d="M330 170H400"/>
  <path class="edge" d="M500 215V245H240V285"/>
  <path class="edge" d="M500 215V245H640V285"/>
  <path class="edge" d="M240 385V420H500V455"/>
  <path class="edge" d="M640 385V420H500V455"/>
  <path class="edge" d="M500 555V610"/>
  <path class="edge" d="M625 660H690"/>
  <path class="edge dash" d="M190 775V420H240V385"/>
  <path class="edge dash" d="M310 775V740H720V385H640"/>
  <path class="edge dash" d="M310 825H390"/>
  <path class="edge dash" d="M310 855H810V710"/>
  <text class="edge-label" x="350" y="811">gera</text>
  <text class="edge-label" x="778" y="846">orquestra a verificação</text>



  <rect class="node blue" x="90" y="125" width="240" height="90" rx="16"/>
  <text class="label" x="210" y="158">generate_dataset.py</text><text class="detail" x="210" y="190">gera as imagens de teste</text>
  <rect class="node blue" x="400" y="125" width="200" height="90" rx="45"/>
  <text class="label" x="500" y="158">dataset/*.jpg</text><text class="detail" x="500" y="190">entrada</text>

  <rect class="node" x="115" y="285" width="250" height="100" rx="16"/>
  <text class="label" x="240" y="324">sequential.py</text><text class="detail" x="240" y="358">1 processo</text>
  <rect class="node blue" x="515" y="285" width="250" height="100" rx="16"/>
  <text class="label" x="640" y="324">parallel.py</text><text class="detail" x="640" y="358">multiprocessing.Pool</text>

  <rect class="node blue" x="350" y="455" width="300" height="100" rx="16"/>
  <text class="label" x="500" y="494">image_processor.py</text><text class="detail" x="500" y="528">gray → blur → Sobel</text>
  <rect class="node blue" x="375" y="610" width="250" height="100" rx="45"/>
  <text class="label" x="500" y="647">output/</text><text class="detail" x="500" y="681">sequential/ · parallel/</text>
  <rect class="node" x="690" y="610" width="240" height="100" rx="16"/>
  <text class="label" x="810" y="649">verify.py</text><text class="detail" x="810" y="683">SHA-256</text>

  <rect class="node blue" x="70" y="775" width="240" height="100" rx="16"/>
  <text class="label" x="190" y="814">benchmark.py</text><text class="detail" x="190" y="848">orquestra as medições</text>
  <rect class="node blue" x="390" y="775" width="280" height="100" rx="45"/>
  <text class="label" x="530" y="812">results/benchmark.csv</text><text class="detail" x="530" y="846">speedup + Amdahl</text>

  <rect class="section aws" x="30" y="935" width="940" height="200" rx="26"/>
  <text class="title" x="70" y="981" fill="#d97706">aws/</text><text class="subtitle" x="132" y="981">EC2</text>
  <path class="edge" d="M260 1055H350"/><path class="edge" d="M590 1055H680"/>
  <rect class="node amber" x="70" y="1010" width="190" height="90" rx="16"/>
  <text class="label" x="165" y="1043">user-data.sh</text><text class="detail" x="165" y="1075">1º boot</text>
  <rect class="node amber" x="350" y="1010" width="240" height="90" rx="16"/>
  <text class="label" x="470" y="1043">benchmark.py</text><text class="detail" x="470" y="1075">gera benchmark.csv</text>
  <rect class="node amber" x="680" y="1010" width="250" height="90" rx="16"/>
  <text class="label" x="805" y="1043">server.py</text><text class="detail" x="805" y="1075">painel HTTP · porta 80</text>

  <rect class="section web" x="30" y="1170" width="940" height="180" rx="26"/>
  <text class="title" x="70" y="1216" fill="#7c3aed">web/</text><text class="subtitle" x="140" y="1216">GitHub Pages</text>
  <path class="edge" d="M445 1275H555"/>
  <rect class="node violet" x="90" y="1230" width="355" height="90" rx="16"/>
  <text class="label" x="267.5" y="1263">runner.js</text><text class="detail" x="267.5" y="1295">thread principal × Web Workers</text>
  <rect class="node violet" x="555" y="1230" width="355" height="90" rx="16"/>
  <text class="label" x="732.5" y="1263">processor.js</text><text class="detail" x="732.5" y="1295">gray → blur → Sobel</text>
</svg>