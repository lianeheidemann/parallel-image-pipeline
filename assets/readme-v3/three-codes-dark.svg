<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
<title id="title">Três versões do mesmo pipeline</title>
<desc id="desc">Um mesmo pipeline de processamento de imagens roda em três lugares: local no PC com Python, na nuvem numa instância EC2 da AWS, e no navegador com JavaScript.</desc>
<defs><style>
.panel{fill:#0d1117;stroke:#30363d;stroke-width:1.5}
.h{font:600 24px Inter,Segoe UI,Arial,sans-serif;fill:#f0f3f6;text-anchor:middle}
.sub{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#9da7b3;text-anchor:middle}
.box{fill:#161b22;stroke:#30363d;stroke-width:1.5}
.name{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#f0f3f6;text-anchor:middle}
.path{font:600 13px ui-monospace,Consolas,monospace;fill:#9da7b3;text-anchor:middle}
.desc{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#f0f3f6;text-anchor:middle}
.icon{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.arrow{stroke:#6e7681;stroke-width:2;fill:none;marker-end:url(#arrowhead-dark)}
</style>
<marker id="arrowhead-dark" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
  <path d="M0,0 L8,4 L0,8 z" fill="#6e7681"/>
</marker>
</defs>

<rect class="panel" x="10" y="10" width="940" height="360" rx="14"/>
<text class="h" x="480" y="46">Três versões do mesmo pipeline</text>
<text class="sub" x="480" y="70">cinza → blur gaussiano → Sobel, rodando em lugares diferentes</text>

<!-- local -->
<rect class="box" x="30" y="100" width="280" height="230" rx="10"/>
<rect x="30" y="100" width="280" height="6" rx="3" fill="#58a6ff"/>
<g class="icon" stroke="#58a6ff" transform="translate(140,130)">
  <rect x="0" y="0" width="80" height="52" rx="4"/>
  <line x1="40" y1="52" x2="40" y2="66"/>
  <line x1="18" y1="66" x2="62" y2="66"/>
</g>
<text class="name" x="170" y="222">local/</text>
<text class="path" x="170" y="244">seu PC</text>
<text class="desc" x="170" y="278">Python +</text>
<text class="desc" x="170" y="296">multiprocessing</text>

<!-- aws -->
<rect class="box" x="340" y="100" width="280" height="230" rx="10"/>
<rect x="340" y="100" width="280" height="6" rx="3" fill="#ffa657"/>
<g class="icon" stroke="#ffa657" transform="translate(440,132)">
  <path d="M20,40 a16,16 0 0 1 0,-32 a20,20 0 0 1 39,-6 a15,15 0 0 1 1,38 z"/>
</g>
<text class="name" x="480" y="222">aws/</text>
<text class="path" x="480" y="244">nuvem (EC2)</text>
<text class="desc" x="480" y="278">mesmo código do local/</text>
<text class="desc" x="480" y="296">+ painel HTTP</text>

<!-- web -->
<rect class="box" x="650" y="100" width="280" height="230" rx="10"/>
<rect x="650" y="100" width="280" height="6" rx="3" fill="#56d364"/>
<g class="icon" stroke="#56d364" transform="translate(750,130)">
  <rect x="0" y="0" width="80" height="56" rx="4"/>
  <line x1="0" y1="16" x2="80" y2="16"/>
  <circle cx="10" cy="8" r="2" fill="#56d364" stroke="none"/>
  <circle cx="18" cy="8" r="2" fill="#56d364" stroke="none"/>
  <circle cx="26" cy="8" r="2" fill="#56d364" stroke="none"/>
</g>
<text class="name" x="790" y="222">web/</text>
<text class="path" x="790" y="244">navegador</text>
<text class="desc" x="790" y="278">JavaScript +</text>
<text class="desc" x="790" y="296">Web Workers</text>

<path class="arrow" d="M312,215 L336,215"/>
<path class="arrow" d="M622,215 L646,215"/>

<text class="sub" x="480" y="354">Comece pelo local/ — é a referência de tempo que as outras duas comparam</text>
</svg>
