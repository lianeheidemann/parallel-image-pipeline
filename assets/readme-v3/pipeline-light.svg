<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="475" viewBox="0 0 1500 475" role="img" aria-labelledby="title desc"><title id="title">Pipeline real de processamento de imagens</title><desc id="desc">A mesma cena em BGR, cinza, desfocada, nos gradientes Sobel, na magnitude e no PNG final.</desc><defs><filter id="blur"><feGaussianBlur stdDeviation="4"/></filter><clipPath id="c1"><rect x="60" y="195" width="180" height="105" rx="4"/></clipPath><clipPath id="c2"><rect x="300" y="195" width="180" height="105" rx="4"/></clipPath><clipPath id="c3"><rect x="540" y="195" width="180" height="105" rx="4"/></clipPath><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c959f"/></marker><style>.panel{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5}.node{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}.heading{font:600 24px Inter,Segoe UI,Arial,sans-serif;fill:#1f2328}.sub{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#59636e}.num{font:600 13px Inter,Segoe UI,Arial,sans-serif;fill:#0969da}.label{font:600 16px Inter,Segoe UI,Arial,sans-serif;fill:#1f2328}.detail{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#59636e}.mini{font:600 10px Inter,Segoe UI,Arial,sans-serif;fill:#0969da;text-anchor:middle}.file{font:700 8px Inter,Segoe UI,Arial,sans-serif;fill:#0969da;text-anchor:middle}.arrow{fill:none;stroke:#8c959f;stroke-width:2;marker-end:url(#a)}.foot{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#59636e;text-anchor:middle}</style></defs><rect class="panel" x="15" y="15" width="1470" height="445" rx="10"/><text class="heading" x="40" y="60">Pipeline implementado em image_processor.py</text><text class="sub" x="40" y="88">A mesma cena é mantida nas miniaturas para evidenciar o efeito de cada operação.</text><path class="arrow" d="M260 248H276"/><path class="arrow" d="M500 248H516"/><path class="arrow" d="M740 248H756"/><path class="arrow" d="M980 248H996"/><path class="arrow" d="M1220 248H1236"/><g><rect class="node" x="40" y="140" width="220" height="275" rx="8"/><text class="num" x="60" y="174">01</text><rect x="60" y="195" width="180" height="105" rx="4" fill="#eaeef2"/><g clip-path="url(#c1)"><rect x="60" y="195" width="180" height="105" fill="#6aa7d8"/><circle cx="102" cy="224" r="15" fill="#f2b84b"/><path d="M60 286l48-49 32 30 22-22 78 55H60Z" fill="#557f61"/><rect x="170" y="244" width="38" height="45" fill="#a96d45"/><rect x="181" y="258" width="9" height="31" fill="#3f5060"/></g><text class="label" x="60" y="346">ENTRADA</text><text class="detail" x="60" y="376">cv2.imread · BGR</text></g><g><rect class="node" x="280" y="140" width="220" height="275" rx="8"/><text class="num" x="300" y="174">02</text><rect x="300" y="195" width="180" height="105" rx="4" fill="#eaeef2"/><g clip-path="url(#c2)"><rect x="300" y="195" width="180" height="105" fill="#9aa3ad"/><circle cx="342" cy="224" r="15" fill="#d8dde3"/><path d="M300 286l48-49 32 30 22-22 78 55H300Z" fill="#66717c"/><rect x="410" y="244" width="38" height="45" fill="#777f88"/><rect x="421" y="258" width="9" height="31" fill="#404850"/></g><text class="label" x="300" y="346">ESCALA DE CINZA</text><text class="detail" x="300" y="376">cv2.cvtColor</text></g><g><rect class="node" x="520" y="140" width="220" height="275" rx="8"/><text class="num" x="540" y="174">03</text><rect x="540" y="195" width="180" height="105" rx="4" fill="#eaeef2"/><g clip-path="url(#c3)" filter="url(#blur)"><rect x="540" y="195" width="180" height="105" fill="#9aa3ad"/><circle cx="582" cy="224" r="15" fill="#d8dde3"/><path d="M540 286l48-49 32 30 22-22 78 55H540Z" fill="#66717c"/><rect x="650" y="244" width="38" height="45" fill="#777f88"/><rect x="661" y="258" width="9" height="31" fill="#404850"/></g><text class="label" x="540" y="346">BLUR GAUSSIANO</text><text class="detail" x="540" y="376">kernel 5 × 5 · σ = 0</text></g><g><rect class="node" x="760" y="140" width="220" height="275" rx="8"/><text class="num" x="780" y="174">04</text><rect x="780" y="195" width="180" height="105" rx="4" fill="#eaeef2"/><g><line x1="870" y1="199" x2="870" y2="296" stroke="#d0d7de"/><text class="mini" x="820" y="212">Gx</text><path d="M800 285l34-47M845 266l22-21M824 237l25 29M846 270l36 25M820 211a15 15 0 0 0 0 27M828 211a15 15 0 0 1 0 27M899 244v45M937 244v45M910 258v31M919 258v31" fill="none" stroke="#1f2328" stroke-width="2.5"/><text class="mini" x="920" y="212">Gy</text><path d="M892 286h76M898 244h38M909 258h9M892 224h30M894 214c14-8 27-2 30 10M894 234c14 8 27 2 30-10" fill="none" stroke="#1f2328" stroke-width="2.5"/></g><text class="label" x="780" y="346">SOBEL X E Y</text><text class="detail" x="780" y="376">gradientes direcionais</text></g><g><rect class="node" x="1000" y="140" width="220" height="275" rx="8"/><text class="num" x="1020" y="174">05</text><rect x="1020" y="195" width="180" height="105" rx="4" fill="#eaeef2"/><g><path d="M1020 286l48-49 32 30 22-22 78 55M1130 244h38v45h-38ZM1141 258h9v31M1047 224a15 15 0 1 0 30 0 15 15 0 1 0-30 0Z" fill="none" stroke="#f8fafc" stroke-width="2.6" stroke-linejoin="round"/></g><text class="label" x="1020" y="346">MAGNITUDE</text><text class="detail" x="1020" y="376">cv2.magnitude · clip</text></g><g><rect class="node" x="1240" y="140" width="220" height="275" rx="8"/><text class="num" x="1260" y="174">06</text><rect x="1260" y="195" width="180" height="105" rx="4" fill="#eaeef2"/><g><rect x="1262" y="197" width="156" height="101" fill="#05080d" stroke="#d0d7de" stroke-width="1.5"/><path d="M1262 286l48-49 32 30 22-22 78 55M1372 244h38v45h-38ZM1383 258h9v31M1289 224a15 15 0 1 0 30 0 15 15 0 1 0-30 0Z" fill="none" stroke="#f8fafc" stroke-width="2.6" stroke-linejoin="round"/><path d="M1390 197h28v27" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/><text class="file" x="1404" y="215">PNG</text></g><text class="label" x="1260" y="346">ARQUIVO DE SAÍDA</text><text class="detail" x="1260" y="376">uint8 · cv2.imwrite</text></g><text class="foot" x="750" y="440">Gx e Gy realçam orientações diferentes; a magnitude combina ambos no mapa final de bordas.</text></svg>