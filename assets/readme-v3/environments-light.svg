<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Comparação dos ambientes de execução</title><desc id="desc">Comparação entre Python local, AWS EC2 e GitHub Pages.</desc><defs><filter id="s" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity=".10"/></filter><style>.outer{fill:#ffffff;stroke:#cbd5e1;stroke-width:2;filter:url(#s)}.h{font:700 28px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.sub{font:500 17px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.title{font:700 23px Inter,Segoe UI,Arial,sans-serif}.key{font:700 16px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.val{font:600 19px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.foot{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#475569;text-anchor:middle}</style></defs><rect class="outer" x="25" y="25" width="1150" height="570" rx="28"/><text class="h" x="65" y="78">Três ambientes, duas estratégias de paralelismo</text><text class="sub" x="65" y="108">A AWS reutiliza o código Python local; a versão web implementa o pipeline em JavaScript.</text><g><rect x="55" y="135" width="340" height="410" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="110" cy="190" r="25" fill="#2563eb" opacity=".18"/><circle cx="110" cy="190" r="10" fill="#2563eb"/><text class="title" x="150" y="199" fill="#2563eb">Python local</text><text class="key" x="85" y="260">Onde roda</text><text class="val" x="85" y="290">Computador do usuário</text><line x1="85" y1="315" x2="365" y2="315" stroke="#cbd5e1"/><text class="key" x="85" y="355">Paralelismo</text><text class="val" x="85" y="385">multiprocessing.Pool</text><line x1="85" y1="410" x2="365" y2="410" stroke="#cbd5e1"/><text class="key" x="85" y="450">Unidade de trabalho</text><text class="val" x="85" y="480">1 imagem por tarefa</text><text class="foot" x="225" y="520">Arquivos + relatórios CSV</text></g><g><rect x="430" y="135" width="340" height="410" rx="24" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="485" cy="190" r="25" fill="#d97706" opacity=".18"/><circle cx="485" cy="190" r="10" fill="#d97706"/><text class="title" x="525" y="199" fill="#d97706">AWS EC2</text><text class="key" x="460" y="260">Onde roda</text><text class="val" x="460" y="290">Instância c5.large</text><line x1="460" y1="315" x2="740" y2="315" stroke="#cbd5e1"/><text class="key" x="460" y="355">Paralelismo</text><text class="val" x="460" y="385">multiprocessing.Pool</text><line x1="460" y1="410" x2="740" y2="410" stroke="#cbd5e1"/><text class="key" x="460" y="450">Unidade de trabalho</text><text class="val" x="460" y="480">1 imagem por tarefa</text><text class="foot" x="600" y="520">Painel HTTP + CSV</text></g><g><rect x="805" y="135" width="340" height="410" rx="24" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><circle cx="860" cy="190" r="25" fill="#7c3aed" opacity=".18"/><circle cx="860" cy="190" r="10" fill="#7c3aed"/><text class="title" x="900" y="199" fill="#7c3aed">GitHub Pages</text><text class="key" x="835" y="260">Onde roda</text><text class="val" x="835" y="290">Navegador</text><line x1="835" y1="315" x2="1115" y2="315" stroke="#cbd5e1"/><text class="key" x="835" y="355">Paralelismo</text><text class="val" x="835" y="385">Web Workers</text><line x1="835" y1="410" x2="1115" y2="410" stroke="#cbd5e1"/><text class="key" x="835" y="450">Unidade de trabalho</text><text class="val" x="835" y="480">1 faixa da imagem</text><text class="foot" x="975" y="520">Resultado na própria página</text></g></svg>