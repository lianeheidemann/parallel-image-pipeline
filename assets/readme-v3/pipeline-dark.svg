<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="475" viewBox="0 0 1500 475" role="img" aria-labelledby="title desc"><title id="title">Pipeline real de processamento de imagens</title><desc id="desc">Entrada BGR, conversão para cinza, blur gaussiano, Sobel X e Y, magnitude e arquivo PNG.</desc><defs><filter id="blur"><feGaussianBlur stdDeviation="5"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6e7681"/></marker><style>.panel{fill:#0d1117;stroke:#30363d;stroke-width:1.5}.node{fill:#161b22;stroke:#30363d;stroke-width:1.5}.heading{font:600 24px Inter,Segoe UI,Arial,sans-serif;fill:#f0f3f6}.sub{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#9da7b3}.num{font:600 13px Inter,Segoe UI,Arial,sans-serif;fill:#58a6ff}.label{font:600 16px Inter,Segoe UI,Arial,sans-serif;fill:#f0f3f6}.detail{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#9da7b3}.mini{font:600 11px Inter,Segoe UI,Arial,sans-serif;fill:#58a6ff;text-anchor:middle}.file{font:700 8px Inter,Segoe UI,Arial,sans-serif;fill:#58a6ff;text-anchor:middle}.arrow{fill:none;stroke:#6e7681;stroke-width:2;marker-end:url(#a)}.foot{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#9da7b3;text-anchor:middle}</style></defs><rect class="panel" x="15" y="15" width="1470" height="445" rx="10"/><text class="heading" x="40" y="60">Pipeline implementado em image_processor.py</text><text class="sub" x="40" y="88">Cada execução aplica exatamente a mesma sequência de operações aos pixels da imagem.</text><path class="arrow" d="M260 248H276"/><path class="arrow" d="M500 248H516"/><path class="arrow" d="M740 248H756"/><path class="arrow" d="M980 248H996"/><path class="arrow" d="M1220 248H1236"/><g><rect class="node" x="40" y="140" width="220" height="275" rx="8"/><text class="num" x="60" y="174">01</text><rect x="60" y="195" width="180" height="105" rx="4" fill="#21262d"/><g><rect x="76" y="211" width="148" height="73" fill="#3b82f6"/><circle cx="112" cy="235" r="17" fill="#f59e0b"/><path d="M76 284l45-42 31 27 25-21 47 36Z" fill="#22c55e"/></g><text class="label" x="60" y="346">ENTRADA</text><text class="detail" x="60" y="376">cv2.imread · BGR</text></g><g><rect class="node" x="280" y="140" width="220" height="275" rx="8"/><text class="num" x="300" y="174">02</text><rect x="300" y="195" width="180" height="105" rx="4" fill="#21262d"/><g><rect x="316" y="211" width="148" height="73" fill="#7c8794"/><circle cx="352" cy="235" r="17" fill="#d0d7de"/><path d="M316 284l45-42 31 27 25-21 47 36Z" fill="#4b5563"/></g><text class="label" x="300" y="346">ESCALA DE CINZA</text><text class="detail" x="300" y="376">cv2.cvtColor</text></g><g><rect class="node" x="520" y="140" width="220" height="275" rx="8"/><text class="num" x="540" y="174">03</text><rect x="540" y="195" width="180" height="105" rx="4" fill="#21262d"/><g filter="url(#blur)"><rect x="556" y="211" width="148" height="73" fill="#7c8794"/><circle cx="592" cy="235" r="17" fill="#d0d7de"/><path d="M556 284l45-42 31 27 25-21 47 36Z" fill="#4b5563"/></g><text class="label" x="540" y="346">BLUR GAUSSIANO</text><text class="detail" x="540" y="376">kernel 5 × 5 · σ = 0</text></g><g><rect class="node" x="760" y="140" width="220" height="275" rx="8"/><text class="num" x="780" y="174">04</text><rect x="780" y="195" width="180" height="105" rx="4" fill="#21262d"/><g><line x1="850" y1="205" x2="850" y2="290" stroke="#30363d"/><text class="mini" x="812" y="216">Gx</text><path d="M790 273V226M812 273V226M834 273V226" stroke="#f0f3f6" stroke-width="3"/><text class="mini" x="887" y="216">Gy</text><path d="M864 235H935M864 254H935M864 273H935" stroke="#f0f3f6" stroke-width="3"/></g><text class="label" x="780" y="346">SOBEL X E Y</text><text class="detail" x="780" y="376">gradientes Gx e Gy</text></g><g><rect class="node" x="1000" y="140" width="220" height="275" rx="8"/><text class="num" x="1020" y="174">05</text><rect x="1020" y="195" width="180" height="105" rx="4" fill="#21262d"/><g><path d="M1035 279l34-60 28 48 25-36 44 48M1052 214v68M1135 214v68" fill="none" stroke="#f0f3f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text class="label" x="1020" y="346">MAGNITUDE</text><text class="detail" x="1020" y="376">cv2.magnitude · clip</text></g><g><rect class="node" x="1240" y="140" width="220" height="275" rx="8"/><text class="num" x="1260" y="174">06</text><rect x="1260" y="195" width="180" height="105" rx="4" fill="#21262d"/><g><rect x="1280" y="207" width="140" height="81" fill="#05080d" stroke="#30363d"/><path d="M1295 277l31-56 26 45 23-33 31 44M1308 214v67M1383 214v67" fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round"/><path d="M1398 202h29v30" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text class="file" x="1412" y="221">PNG</text></g><text class="label" x="1260" y="346">ARQUIVO DE SAÍDA</text><text class="detail" x="1260" y="376">uint8 · cv2.imwrite</text></g><text class="foot" x="750" y="440">A saída é um mapa de magnitude das bordas em PNG; não é uma imagem binária.</text></svg>