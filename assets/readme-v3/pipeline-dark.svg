<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
 <title id="title">Pipeline de processamento de imagens</title><desc id="desc">Imagem BGR convertida para cinza, suavizada com filtro gaussiano, processada com Sobel e salva como mapa de bordas.</desc>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker>
 <filter id="s" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity=".24"/></filter>
 <linearGradient id="blur" x1="0" x2="1"><stop stop-color="#475569"/><stop offset=".5" stop-color="#cbd5e1"/><stop offset="1" stop-color="#64748b"/></linearGradient>
 <style>.card{fill:#111827;stroke:#60a5fa;stroke-width:2;filter:url(#s)}.node{fill:#1e293b;stroke:#94a3b8;stroke-width:2}.focus{fill:#172554;stroke:#60a5fa}.t{font:700 23px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc;text-anchor:middle}.d{font:500 17px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1;text-anchor:middle}.h{font:700 28px Inter,Segoe UI,Arial,sans-serif;fill:#60a5fa}.e{fill:none;stroke:#94a3b8;stroke-width:3;marker-end:url(#a)}</style></defs>
 <rect class="card" x="25" y="25" width="1150" height="510" rx="28"/><text class="h" x="65" y="78">Pipeline visual</text><text class="d" x="600" y="112">A mesma transformação é aplicada nas execuções sequencial e paralela.</text>
 <path class="e" d="M255 300H285"/><path class="e" d="M485 300H515"/><path class="e" d="M715 300H745"/><path class="e" d="M945 300H975"/>
 <g><rect class="node" x="55" y="180" width="200" height="240" rx="20"/><rect x="85" y="215" width="140" height="92" rx="12" fill="#2563eb"/><circle cx="130" cy="255" r="24" fill="#f59e0b"/><path d="M85 286l38-35 30 27 25-21 47 49H85Z" fill="#22c55e"/><text class="t" x="155" y="350">Entrada</text><text class="d" x="155" y="382">imagem JPG · BGR</text></g>
 <g><rect class="node" x="285" y="180" width="200" height="240" rx="20"/><rect x="315" y="215" width="140" height="92" rx="12" fill="#64748b"/><circle cx="360" cy="255" r="24" fill="#cbd5e1"/><path d="M315 286l38-35 30 27 25-21 47 49H315Z" fill="#334155"/><text class="t" x="385" y="350">Escala de cinza</text><text class="d" x="385" y="382">cv2.cvtColor</text></g>
 <g><rect class="node" x="515" y="180" width="200" height="240" rx="20"/><rect x="545" y="215" width="140" height="92" rx="12" fill="url(#blur)"/><circle cx="590" cy="255" r="28" fill="#d1d5db" opacity=".65"/><text class="t" x="615" y="350">Blur gaussiano</text><text class="d" x="615" y="382">kernel 5 × 5</text></g>
 <g><rect class="node focus" x="745" y="180" width="200" height="240" rx="20"/><rect x="775" y="215" width="140" height="92" rx="12" fill="#0f172a"/><path d="M790 292l38-61 28 49 20-36 25 48M820 220v80M882 220v80" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/><text class="t" x="845" y="350">Sobel X e Y</text><text class="d" x="845" y="382">magnitude do gradiente</text></g>
 <g><rect class="node" x="975" y="180" width="170" height="240" rx="20"/><rect x="1000" y="215" width="120" height="92" rx="12" fill="#020617"/><path d="M1015 292l30-61 24 49 17-36 20 48" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text class="t" x="1060" y="350">Saída</text><text class="d" x="1060" y="382">bordas · PNG</text></g>
 <text class="d" x="600" y="485">Conversão determinística: a mesma entrada deve produzir os mesmos bytes.</text>
 </svg>