name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

      - name: Cloud setup script syntax
        run: bash -n aws/user-data.sh

      - name: Generate sample dataset
        run: python local/generate_dataset.py --count 20 --output dataset

      - name: Run sequential pipeline
        run: python local/sequential.py --dataset dataset --output output/sequential --report results/sequential_report.csv

      - name: Run parallel pipeline
        run: python local/parallel.py --dataset dataset --output output/parallel --report results/parallel_report.csv --workers 2

      - name: Verify sequential == parallel (SHA-256)
        run: python local/verify.py --sequential output/sequential --parallel output/parallel

      - name: Benchmark (fails if any output differs)
        run: python local/benchmark.py --dataset dataset --workers 2 --repeat 1

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Web tests (strips == whole image, cache versions)
        run: node --test tests/web/*.test.mjs
