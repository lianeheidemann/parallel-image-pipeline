name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

      - name: Cloud setup script syntax
        run: bash -n code/aws/user-data.sh

      # Roda sequencial e paralelo e verifica as saidas por SHA-256 (falha se divergirem).
      - name: Benchmark
        run: python code/local/benchmark.py --dataset dataset/dataset-100 --workers 2 --repeat 1

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Web tests (strips == whole image, cache versions)
        run: node --test tests/web/*.test.mjs
