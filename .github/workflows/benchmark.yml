name: Benchmark (Python e web no GitHub)

# Roda manualmente (aba Actions > "Run workflow"). Mede, na mesma maquina do GitHub e
# com o mesmo dataset, a versao Python (local/benchmark.py) e a versao web (Web Workers
# num Chromium headless), e publica a comparacao com graficos como artefato.
# O padrao (100 imagens de 1920x1080) e o mesmo de doc/como-rodar.md, secao 4: como o
# gerador usa semente fixa por imagem, sao as mesmas imagens do PC.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Numero de imagens do dataset"
        default: "100"
      width:
        description: "Largura das imagens"
        default: "1920"
      height:
        description: "Altura das imagens"
        default: "1080"
      repeat:
        description: "Rodadas por configuracao (mediana)"
        default: "3"

permissions:
  contents: read

env:
  DATASET: dataset-comparacao
  OUT: results/comparacao

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci
          npx playwright install --with-deps chromium

      - name: Machine info
        run: |
          mkdir -p "$OUT"
          { echo "runner: ${{ runner.os }} ${{ runner.arch }}"; nproc | sed 's/^/nucleos: /'; lscpu | grep "Model name"; free -h | grep Mem; } | tee "$OUT/maquina-actions.txt"

      - name: Generate dataset
        run: python local/generate_dataset.py --count ${{ inputs.count }} --width ${{ inputs.width }} --height ${{ inputs.height }} --output "$DATASET"

      # Contagens acima dos nucleos da maquina sao ignoradas pelo proprio benchmark.
      - name: Python benchmark
        run: |
          python local/benchmark.py --dataset "$DATASET" --results "$OUT" --workers 2 4 8 --repeat ${{ inputs.repeat }}
          mv "$OUT/benchmark.csv" "$OUT/benchmark-actions.csv"

      - name: Web benchmark (Chromium headless)
        run: node tools/web-benchmark.mjs --dataset "$DATASET" --out "$OUT/benchmark-web.csv"

      # Aqui nao ha o PC da equipe: o CSV Python desta maquina entra como "actions".
      - name: Compare
        run: |
          python local/compare_environments.py --dir "$OUT"
          grep -v '^!\[' "$OUT/comparacao.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-github
          path: |
            ${{ env.OUT }}/benchmark-actions.csv
            ${{ env.OUT }}/benchmark-web.csv
            ${{ env.OUT }}/comparison.csv
            ${{ env.OUT }}/comparacao.md
            ${{ env.OUT }}/graficos/
            ${{ env.OUT }}/maquina-actions.txt
